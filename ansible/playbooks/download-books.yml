- name: Download and Scale Data
  hosts: storage
  become: yes

  tasks:
    - name: Ensure data directory exists
      ansible.builtin.file:
        path: /data/books
        state: directory
        mode: "0777"

    - name: Download Books
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/data/books/{{ item.name }}"
        mode: "0644"
      loop:
        - {
            name: "alice.txt",
            url: "https://www.gutenberg.org/files/11/11-0.txt",
          }
        - {
            name: "sherlock.txt",
            url: "https://www.gutenberg.org/files/1661/1661-0.txt",
          }
        - {
            name: "pride.txt",
            url: "https://www.gutenberg.org/files/1342/1342-0.txt",
          }
        - {
            name: "dracula.txt",
            url: "https://www.gutenberg.org/files/345/345-0.txt",
          }
        - {
            name: "frankenstein.txt",
            url: "https://www.gutenberg.org/files/84/84-0.txt",
          }
        - {
            name: "moby.txt",
            url: "https://www.gutenberg.org/files/2701/2701-0.txt",
          }
        - {
            name: "ulysses.txt",
            url: "https://www.gutenberg.org/files/4300/4300-0.txt",
          }
        - {
            name: "huckfinn.txt",
            url: "https://www.gutenberg.org/files/76/76-0.txt",
          }
        - {
            name: "gatsby.txt",
            url: "https://www.gutenberg.org/files/64317/64317-0.txt",
          }
        - {
            name: "dorian.txt",
            url: "https://www.gutenberg.org/files/174/174-0.txt",
          }

    - name: Create 300MB BigData file
      ansible.builtin.shell: |
        # 1. Clean up any old files
        rm -f /data/books/big_test.txt /tmp/combining_books.txt

        # 2. Combine the original 10 books into a temporary file first
        cat /data/books/alice.txt /data/books/sherlock.txt /data/books/pride.txt \
            /data/books/dracula.txt /data/books/frankenstein.txt /data/books/moby.txt \
            /data/books/ulysses.txt /data/books/huckfinn.txt /data/books/gatsby.txt \
            /data/books/dorian.txt > /tmp/combining_books.txt

        # 3. Duplicate that combined file 50 times into the final destination
        for i in {1..50}; do cat /tmp/combining_books.txt >> /data/books/big_test.txt; done

        # 4. Cleanup
        rm /tmp/combining_books.txt
      args:
        executable: /bin/bash
